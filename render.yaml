services:
  - type: web
    name: line-order-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_LINE_NAMES
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DB_PATH
        value: data/orders.db
